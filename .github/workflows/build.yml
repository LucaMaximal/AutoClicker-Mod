name: Build

on:
  push:
  pull_request:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    name: Build Fabric mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Collect mod JARs
        shell: bash
        run: |
          mkdir -p workflow-artifacts
          find build/libs -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            -exec cp {} workflow-artifacts/ \;
          test -n "$(find workflow-artifacts -maxdepth 1 -type f -name '*.jar' -print -quit)"

      - name: Upload mod JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: autoclicker-mod-jar
          path: workflow-artifacts/*.jar
          if-no-files-found: error

      - name: Attach mod JAR to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" workflow-artifacts/*.jar --clobber
